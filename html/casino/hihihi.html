<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Croissantage - Entrée</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
        }
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #0a0b10; 
            overflow: hidden; 
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        .intro-container { 
            text-align: center; 
            transition: opacity 1s ease, transform 1s ease; 
        }
        .intro-container h1 { 
            font-size: 5rem; 
            color: var(--gold); 
            text-shadow: 0 0 20px var(--gold-glow); 
            margin-bottom: 10px; 
            font-family: 'Cinzel', serif;
        }
        .subtitle {
            color: #a0a5b5;
            margin-bottom: 40px;
            font-style: italic;
            letter-spacing: 2px;
        }
        .enter-btn { 
            padding: 15px 40px; 
            font-size: 1.2rem; 
            background: transparent; 
            color: var(--gold); 
            border: 2px solid var(--gold); 
            border-radius: 6px;
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: all 0.3s ease; 
            font-family: 'Inter', sans-serif;
        }
        .enter-btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 20px var(--gold-glow); 
            transform: scale(1.05);
        }
        .enter-btn:active {
            transform: scale(0.95);
        }
        .fade-out { 
            opacity: 0; 
            transform: scale(1.1); 
        }
    </style>
</head>
<body>
    <div class="intro-container" id="intro">
        <h1>CROISSANTAGE</h1>
        <div class="subtitle">hihihi... la chance vous sourit ?</div>
        <button class="enter-btn" onclick="enterCasino()">Entrer au Casino</button>
    </div>

    <script>
        // Logique de transition directement intégrée pour l'écran d'accueil
        function enterCasino() {
            const container = document.getElementById('intro');
            // Ajoute la classe qui déclenche l'animation CSS (fondu + zoom)
            container.classList.add('fade-out');

            // On efface la position sauvegardée du lobby : en arrivant depuis
            // l'écran d'entrée, on veut toujours spawn au centre, pas reprendre
            // une position laissée par une session précédente dans cet onglet.
            try { sessionStorage.removeItem('croissantage_lobby_pos'); } catch (e) { /* stockage indisponible, tant pis */ }

            // Attend 1 seconde (le temps de l'animation) puis redirige vers le lobby
            setTimeout(() => {
                window.location.href = 'lobby.html';
            }, 1000);
        }
    </script>
</body>
</html>
