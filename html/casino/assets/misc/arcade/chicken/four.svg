<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 132" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Four de cuisine (porte vitrée, panneau de commande avec écran) -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4f5c"/>
      <stop offset="100%" stop-color="#23262e"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3e49"/>
      <stop offset="100%" stop-color="#262930"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d976"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6f2a"/>
    </linearGradient>
    <radialGradient id="inside" cx="50%" cy="85%" r="80%">
      <stop offset="0%" stop-color="#5a2a0c"/>
      <stop offset="55%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#0b0605"/>
    </radialGradient>
    <radialGradient id="knob" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f4d976"/>
      <stop offset="60%" stop-color="#b8922e"/>
      <stop offset="100%" stop-color="#5e4a18"/>
    </radialGradient>
  </defs>
  <!-- pieds -->
  <rect x="10" y="122" width="14" height="8" rx="2" fill="#15171c"/>
  <rect x="86" y="122" width="14" height="8" rx="2" fill="#15171c"/>
  <!-- caisson -->
  <rect x="2" y="2" width="106" height="122" rx="8" fill="url(#steel)" stroke="#0f1014" stroke-width="2"/>
  <!-- panneau de commande -->
  <rect x="2" y="2" width="106" height="30" rx="8" fill="#1d2027" stroke="#0f1014" stroke-width="2"/>
  <circle cx="15" cy="17" r="7.5" fill="url(#knob)" stroke="#2b220c" stroke-width="1.2"/>
  <path d="M15 17 L15 11" stroke="#2b220c" stroke-width="2" stroke-linecap="round"/>
  <circle cx="95" cy="17" r="7.5" fill="url(#knob)" stroke="#2b220c" stroke-width="1.2"/>
  <path d="M95 17 L100 13" stroke="#2b220c" stroke-width="2" stroke-linecap="round"/>
  <!-- écran (le multiplicateur est affiché en HTML par-dessus) -->
  <rect x="27" y="7" width="56" height="20" rx="3" fill="#07090b" stroke="#4a4f5c" stroke-width="1.2"/>
  <!-- porte -->
  <rect x="8" y="37" width="94" height="82" rx="6" fill="url(#door)" stroke="#121318" stroke-width="2"/>
  <!-- poignée -->
  <rect x="18" y="41" width="74" height="6" rx="3" fill="url(#gold)" stroke="#5e4a18" stroke-width="1"/>
  <!-- vitre -->
  <rect x="17" y="53" width="76" height="58" rx="5" fill="url(#inside)" stroke="#0d0e12" stroke-width="2"/>
  <!-- grilles -->
  <path d="M21 73 H89 M21 91 H89" stroke="#6b5a4a" stroke-width="1.5" opacity=".55"/>
  <!-- résistance -->
  <path d="M22 105 L29 101 L36 105 L43 101 L50 105 L57 101 L64 105 L71 101 L78 105 L85 101 L88 103" fill="none" stroke="#ff6a2a" stroke-width="2" stroke-linejoin="round" opacity=".55"/>
  <!-- reflet de la vitre -->
  <path d="M22 108 L46 56 L58 56 L34 108 Z" fill="#ffffff" opacity=".06"/>
  <path d="M40 108 L64 56 L68 56 L44 108 Z" fill="#ffffff" opacity=".05"/>
</svg>
