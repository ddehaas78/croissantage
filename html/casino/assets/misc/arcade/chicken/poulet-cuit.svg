<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Poulet rôti doré, cuisses vers le haut -->
  <defs>
    <radialGradient id="roast" cx="45%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="40%" stop-color="#eb9a32"/>
      <stop offset="100%" stop-color="#8a3a10"/>
    </radialGradient>
    <radialGradient id="leg" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffd07a"/>
      <stop offset="55%" stop-color="#dc842c"/>
      <stop offset="100%" stop-color="#7d3510"/>
    </radialGradient>
  </defs>
  <g stroke="#4a1f08" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- corps -->
    <path d="M50 38 C30 34 12 46 14 66 C16 84 34 92 50 92 C66 92 84 84 86 66 C88 46 70 34 50 38 Z" fill="url(#roast)"/>
    <!-- os + bouts -->
    <path d="M22 40 L12 22" stroke="#f4ead8" stroke-width="5"/>
    <path d="M78 40 L88 22" stroke="#f4ead8" stroke-width="5"/>
    <circle cx="10" cy="20" r="3.6" fill="#fffaf0" stroke="#bfb39a" stroke-width="1.4"/>
    <circle cx="15" cy="18" r="3.6" fill="#fffaf0" stroke="#bfb39a" stroke-width="1.4"/>
    <circle cx="85" cy="18" r="3.6" fill="#fffaf0" stroke="#bfb39a" stroke-width="1.4"/>
    <circle cx="90" cy="20" r="3.6" fill="#fffaf0" stroke="#bfb39a" stroke-width="1.4"/>
    <!-- cuisses -->
    <path d="M14 58 C8 46 14 34 24 34 C34 34 40 46 36 58 C32 66 18 66 14 58 Z" fill="url(#leg)"/>
    <path d="M86 58 C92 46 86 34 76 34 C66 34 60 46 64 58 C68 66 82 66 86 58 Z" fill="url(#leg)"/>
  </g>
  <!-- sillon du bréchet -->
  <path d="M50 44 C47 58 47 72 50 86" fill="none" stroke="#7a3410" stroke-width="2" opacity=".5"/>
  <!-- peau croustillante -->
  <g fill="#9b4514" opacity=".45">
    <circle cx="40" cy="74" r="2"/><circle cx="62" cy="78" r="2.4"/><circle cx="56" cy="64" r="1.6"/><circle cx="34" cy="64" r="1.6"/><circle cx="68" cy="68" r="1.8"/>
  </g>
  <!-- reflets -->
  <path d="M38 50 C42 46 48 45 50 46" fill="none" stroke="#fff3c4" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <path d="M20 44 C22 40 26 38 28 38" fill="none" stroke="#fff3c4" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
  <path d="M72 38 C76 38 79 40 80 43" fill="none" stroke="#fff3c4" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
  <!-- herbes -->
  <g fill="#3f8a3a">
    <ellipse cx="44" cy="58" rx="2.6" ry="1.2" transform="rotate(-30 44 58)"/>
    <ellipse cx="58" cy="72" rx="2.6" ry="1.2" transform="rotate(25 58 72)"/>
    <ellipse cx="42" cy="82" rx="2.4" ry="1.1" transform="rotate(10 42 82)"/>
  </g>
</svg>
